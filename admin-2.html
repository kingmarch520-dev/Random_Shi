<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Shi — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161A;
    --surface: #1E2126;
    --surface-2: #262A31;
    --border: #33383F;
    --text: #EDEEF0;
    --text-muted: #8B9099;
    --accent: #E8B84B;
    --danger: #D9695A;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, .brand { font-family: 'Space Grotesk', sans-serif; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand { font-size: 18px; font-weight: 700; }
  .brand span { color: var(--accent); }
  .brand-tag {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    margin-left: 8px;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .btn {
    background: var(--accent);
    color: #14161A;
    border: none;
    border-radius: var(--radius);
    padding: 11px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 40px;
  }

  .error-msg {
    background: rgba(217, 105, 90, 0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: none;
  }

  .signout-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  .debug-banner {
    background: rgba(217, 105, 90, 0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 16px 20px 0;
    display: none;
    word-break: break-word;
  }

  .section-title {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: none;
    margin: 32px 0 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    padding-bottom: 8px;
  }

  td {
    padding: 6px 4px;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }

  td input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    width: 100%;
    font-family: inherit;
  }

  .mini-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini-btn.save { border-color: var(--accent); color: var(--accent); }
  .mini-btn.delete { border-color: var(--danger); color: var(--danger); margin-left: 6px; }

  .add-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .add-grid .full { grid-column: 1 / -1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <div class="brand">Random <span>Shi</span><span class="brand-tag">admin</span></div>
  <button class="signout-link" id="signOutBtn" style="display:none;">Sign out</button>
</header>

<div class="debug-banner" id="debugBanner"></div>

<main>

  <div id="loginCard" class="card" style="margin-top: 60px;">
    <h2 style="margin-top:0;">Sign in</h2>
    <div class="error-msg" id="loginError"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password">
    </div>
    <button class="btn" id="loginBtn">Sign in</button>
  </div>

  <div id="dashboard" style="display:none;">

    <div class="section-title">Products</div>
    <table>
      <thead>
        <tr><th>Name</th><th>Price</th><th>Stock</th><th>Image URL</th><th></th></tr>
      </thead>
      <tbody id="productRows"></tbody>
    </table>

    <div class="add-grid">
      <div class="field full"><label>New product name</label><input type="text" id="newName"></div>
      <div class="field"><label>Price</label><input type="number" step="0.01" id="newPrice"></div>
      <div class="field"><label>Stock</label><input type="number" id="newStock"></div>
      <div class="field full"><label>Image URL (optional)</label><input type="text" id="newImage"></div>
      <div class="field full"><button class="btn" id="addProductBtn">Add product</button></div>
    </div>

  </div>

</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Use the SAME config as the customer storefront — this admin app
  // manages the same Firebase project/data, it's just a separate page.
  const firebaseConfig = {
    apiKey: "AIzaSyBe8QREUGYvEjgeHnF9fKUyRE0ig1yi7L0",
    authDomain: "random-shi-4fda6.firebaseapp.com",
    projectId: "random-shi-4fda6",
    storageBucket: "random-shi-4fda6.firebasestorage.app",
    messagingSenderId: "424758365220",
    appId: "1:424758365220:web:bf383053e7df394c2cdcb1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let products = [];

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errorEl.textContent = "Couldn't sign in — check your email and password.";
      errorEl.style.display = 'block';
      showDebug(err);
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    const loginCard = document.getElementById('loginCard');
    const dashboard = document.getElementById('dashboard');
    const signOutBtn = document.getElementById('signOutBtn');
    if (user) {
      loginCard.style.display = 'none';
      dashboard.style.display = 'block';
      signOutBtn.style.display = 'inline';
      loadProducts();
    } else {
      loginCard.style.display = 'block';
      dashboard.style.display = 'none';
      signOutBtn.style.display = 'none';
    }
  });

  async function loadProducts() {
    try {
      const snap = await getDocs(collection(db, "products"));
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderRows();
    } catch (err) {
      console.error(err);
      showDebug(err);
    }
  }

  function renderRows() {
    const tbody = document.getElementById('productRows');
    tbody.innerHTML = products.map(p => `
      <tr data-id="${p.id}">
        <td><input type="text" class="f-name" value="${p.name || ''}"></td>
        <td><input type="number" step="0.01" class="f-price" value="${p.price ?? 0}"></td>
        <td><input type="number" class="f-stock" value="${p.stock ?? 0}"></td>
        <td><input type="text" class="f-image" value="${p.imageUrl || ''}"></td>
        <td style="white-space:nowrap;">
          <button class="mini-btn save">Save</button>
          <button class="mini-btn delete">Delete</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.mini-btn.save').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const row = e.target.closest('tr');
        const id = row.dataset.id;
        const name = row.querySelector('.f-name').value.trim();
        const price = parseFloat(row.querySelector('.f-price').value) || 0;
        const stock = parseInt(row.querySelector('.f-stock').value) || 0;
        const imageUrl = row.querySelector('.f-image').value.trim();
        try {
          await updateDoc(doc(db, "products", id), { name, price, stock, imageUrl });
          showToast('Saved');
        } catch (err) {
          console.error(err);
          showToast("Couldn't save — try again");
        }
      });
    });

    tbody.querySelectorAll('.mini-btn.delete').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const row = e.target.closest('tr');
        const id = row.dataset.id;
        if (!confirm('Delete this product?')) return;
        try {
          await deleteDoc(doc(db, "products", id));
          showToast('Deleted');
          await loadProducts();
        } catch (err) {
          console.error(err);
          showToast("Couldn't delete — try again");
        }
      });
    });
  }

  document.getElementById('addProductBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value) || 0;
    const stock = parseInt(document.getElementById('newStock').value) || 0;
    const imageUrl = document.getElementById('newImage').value.trim();

    if (!name) { showToast('Add a product name first'); return; }

    try {
      await addDoc(collection(db, "products"), { name, price, stock, imageUrl, rating: 0, ratingCount: 0 });
      document.getElementById('newName').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newStock').value = '';
      document.getElementById('newImage').value = '';
      showToast('Product added');
      await loadProducts();
    } catch (err) {
      console.error(err);
      showToast("Couldn't add product — try again");
      showDebug(err);
    }
  });

  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function showDebug(err) {
    const banner = document.getElementById('debugBanner');
    banner.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
    banner.style.display = 'block';
  }
</script>

</body>
</html>
